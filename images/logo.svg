<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Bhopal AC Service logo</title>
  <desc id="logoDesc">Professional AC service logo with cooling accent.</desc>
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#163b6f" />
      <stop offset="100%" stop-color="#0d1f47" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0e9ebd" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="128" height="128" rx="32" fill="url(#logoGradient)" />
  
  <!-- Subtle border highlight -->
  <rect width="128" height="128" rx="32" fill="none" stroke="rgba(14, 158, 189, 0.2)" stroke-width="2" />
  
  <!-- Cooling snowflake/star icon (subtle, upper center) -->
  <g opacity="0.35">
    <!-- Center point -->
    <circle cx="64" cy="36" r="3" fill="url(#accentGradient)" />
    <!-- Vertical lines -->
    <line x1="64" y1="28" x2="64" y2="20" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" />
    <line x1="64" y1="44" x2="64" y2="52" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" />
    <!-- Horizontal lines -->
    <line x1="56" y1="36" x2="48" y2="36" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" />
    <line x1="72" y1="36" x2="80" y2="36" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" />
    <!-- Diagonal lines -->
    <line x1="59" y1="31" x2="54" y2="26" stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="69" y1="41" x2="74" y2="46" stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <!-- BAC Text with better styling -->
  <text x="64" y="85" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="Outfit, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="2.5">BAC</text>
</svg>